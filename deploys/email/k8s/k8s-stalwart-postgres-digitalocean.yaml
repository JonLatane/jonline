# Stalwart's OWN Postgres -- an alternative backing store for Stalwart's config (accepted
# domains, MTA hook definitions, DKIM keys, TLS state) and queue, instead of the embedded RocksDB
# store on stalwart-data's PVC (see ../stalwart.yaml). Pick "PostgreSQL" as the storage backend in
# Stalwart's setup wizard and point it at stalwart-postgres.jonline-email.svc.cluster.local:5432
# with the credentials below. Distinct from each domain's own `jonline-postgres`
# (../../k8s/k8s-postgres-digitalocean.yaml), whose structure this mirrors -- sized down to 1Gi
# since this only ever holds Stalwart's own config/queue, never user mailboxes (same reasoning as
# stalwart-data's PVC comment in ../stalwart.yaml).
apiVersion: v1
kind: Service
metadata:
  name: stalwart-postgres
  namespace: jonline-email
  labels:
    app: stalwart-postgres
spec:
  clusterIP: None
  ports:
    - port: 5432
  selector:
    app: stalwart-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart-postgres
  namespace: jonline-email
  labels:
    app: stalwart-postgres
spec:
  serviceName: stalwart-postgres
  replicas: 1
  selector:
    matchLabels:
      app: stalwart-postgres
  template:
    metadata:
      labels:
        app: stalwart-postgres
    spec:
      volumes:
      - name: pv-data
        persistentVolumeClaim:
          claimName: stalwart-postgres-pv-claim
      containers:
        - image: postgres:14.5-alpine
          name: db
          env:
            - name: POSTGRES_USER
              value: admin
            - name: POSTGRES_DB
              value: stalwart
            - name: POSTGRES_PASSWORD
              value: secure_password1
          ports:
            - containerPort: 5432
              name: db
          volumeMounts:
          - name: pv-data
            mountPath: /var/lib/postgresql/data
            subPath: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: stalwart-postgres
  name: stalwart-postgres-pv-claim
  namespace: jonline-email
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: do-block-storage-retain
