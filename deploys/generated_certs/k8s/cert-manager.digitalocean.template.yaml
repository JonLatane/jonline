apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: ${CERT_MANAGER_EMAIL}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - selector:
        dnsZones:
          - "${CERT_MANAGER_DOMAIN}"
      dns01:
        digitalocean:
          tokenSecretRef:
            name: digitalocean-dns
            key: access-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rellm-letsencrypt-cert
spec:
  secretName: rellm-generated-tls
  issuerRef: 
    kind: Issuer
    name: letsencrypt-prod
  commonName: "${CERT_MANAGER_DOMAIN}"
  dnsNames:
    - "${CERT_MANAGER_DOMAIN}"
    - "*.${CERT_MANAGER_DOMAIN}"
