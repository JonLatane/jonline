apiVersion: v1
kind: Service
metadata:
  name: rellm-minio
  labels:
    app: rellm-minio
spec:
  clusterIP: None
  ports:
    - port: 9000
      protocol: TCP
  selector:
    app: rellm-minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rellm-minio
  labels:
    app: rellm-minio
spec:
  serviceName: rellm-minio
  replicas: 1
  selector:
    matchLabels:
      app: rellm-minio
  template:
    metadata:
      labels:
        app: rellm-minio
    spec:
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: minio-pv-claim
      containers:
      - name: minio
        image: minio/minio:latest
        args:
        - server
        - /storage
        env:
        - name: MINIO_ACCESS_KEY
          value: "minio"
        - name: MINIO_SECRET_KEY
          value: "minio123"
        ports:
        - containerPort: 9000
        volumeMounts:
        - name: storage
          mountPath: "/storage"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: minio
  name: minio-pv-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: do-block-storage-retain
