<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Connecting to Facebook…</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #16181d;
      color: #f5f5f5;
      text-align: center;
    }

    img {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <img src="/favicon.png" alt="">
  <p id="message">Connecting to Facebook…</p>
  <script>
    // This page is only ever loaded inside the popup window `facebookLoginPopup` opens (see
    // index.html) -- Facebook's OAuth dialog redirects the popup here (`response_type=token`
    // puts the token in the URL fragment, which never touches any server), we hand it back to
    // the window that opened us via `postMessage`, then close. If this page is somehow opened
    // directly (no `window.opener`), there's nothing to hand the token back to, so it just shows
    // a message instead of erroring.
    (function () {
      var params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      var accessToken = params.get("access_token");
      var error = params.get("error_description") || params.get("error");

      if (!window.opener) {
        document.getElementById("message").textContent = accessToken
          ? "You're connected to Facebook. You can close this window."
          : "Facebook login didn't complete. You can close this window.";
        return;
      }

      window.opener.postMessage(
        { source: "jonline-facebook-login", accessToken: accessToken, error: error },
        window.location.origin
      );
      window.close();
    })();
  </script>
</body>

</html>
