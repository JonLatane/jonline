<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Connecting…</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #16181d;
      color: #f5f5f5;
      text-align: center;
    }

    img {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <img src="/favicon.png" alt="">
  <p id="message">Connecting…</p>
  <script>
    // This page is only ever loaded inside the popup window `facebookLoginPopup` opens (see
    // index.html) -- for the `"facebook"` provider, Facebook's OAuth dialog redirects the popup
    // here with `response_type=token`, putting the token in the URL *hash* fragment (which never
    // touches any server); every other provider (`"threads"`, `"x_twitter"`, `"mastodon"`, ...)
    // uses `response_type=code` instead, putting an authorization code in the URL *query* string
    // (same param name, `code`, for all of them -- any provider-specific extra like X's
    // `code_verifier` never appears here at all, since index.html already holds onto it locally
    // and reattaches it once this page's `postMessage` arrives). We
    // hand back whichever is present to the window that opened us via `postMessage` (under the
    // same `accessToken` message field either way -- see `Ports.facebookLoginResult`'s own doc,
    // the Elm side treats it as just "the short-lived credential" regardless of flavor), then
    // close. If this page is somehow opened directly (no `window.opener`), there's nothing to hand
    // the value back to, so it just shows a message instead of erroring.
    (function () {
      var hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      var queryParams = new URLSearchParams(window.location.search);

      // Facebook's implicit flow (hash `access_token`) is checked first, since it's the existing/
      // more common case; Threads' code flow (query `code`) is the fallback when no hash token is
      // present. Either flow's error redirect uses the same `error`/`error_description` query
      // param convention, so that's always read from the query string regardless of which flavor
      // succeeded (a failed exchange has no hash at all).
      var accessToken = hashParams.get("access_token") || queryParams.get("code");
      var error = queryParams.get("error_description") || queryParams.get("error");

      if (!window.opener) {
        document.getElementById("message").textContent = accessToken
          ? "You're connected. You can close this window."
          : "Login didn't complete. You can close this window.";
        return;
      }

      window.opener.postMessage(
        { source: "rellm-oauth-login", accessToken: accessToken, error: error },
        window.location.origin
      );
      window.close();
    })();
  </script>
</body>

</html>
