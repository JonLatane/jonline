syntax = "proto3";

package jonline;

import "google/protobuf/empty.proto";

import "authentication.proto";
import "users.proto";
import "media.proto";
import "messages.proto";
import "posts.proto";
import "events.proto";
import "groups.proto";
import "sync.proto";
import "federation.proto";
import "server_configuration.proto";

// [Jonline](https://github.com/JonLatane/jonline) is a social media protocol with support for Users (and Follows), Media, Posts, Events, Groups, and Messages. It is designed to be federated, 
// but does not require federation to be a useful next-gen forum type solution.
// It is designed to be used with a variety of frontends, including web, mobile, and desktop applications. It interoperates across numerous ports, protocols, and formats, including
// gRPC, HTTP, HTTPS, and ICS/iCal, and is designed to link with SMTP via Stalwart (and other SMTP servers/providers), Facebook Page APIs for post ing Events, and more.
// Essentially, your server is your own customizable, self-contained social network.
//
// Jonline is designed to be easy to run and deploy yourself with a [2 minute setup with Homebrew](#2-minute-startup-with-homebrew) and [3 minute setup on Linux](#3-minute-startup-on-linux),
// [images](https://hub.docker.com/r/jonlatane/jonline/tags) on [DockerHub](https://hub.docker.com/r/jonlatane/jonline_preview_generator/tags) and deployment to your K8s clusters available via
// a simple but powerful `Makefile`-based design language.
//
// #### Ports & Protocols
// Jonline servers interact across several ports:
// * [gRPC (27707)](#grpc-api) - The main Jonline gRPC API. This is the primary port for all Jonline clients. It may or may not be TLS-enabled (443).
//      * Clients are expected to negotiate the gRPC host via the [`backend_host` HTTP endpoint (see below)](#http-based-client-host-negotiation-for-external-cdns) on port 80/443.
// * [HTTP (80, 8000, 27705), HTTPS (443)](#http-endpoints) - The main Jonline HTTP API. This is used for some endpoints, including media upload/download, and for negotiating the gRPC host.
//      * Port 443 will serve up a secure HTTPS server. If it fails to startup, Jonline handles this gracefully and degrades to plain HTTP.
//      * Port 80 will serve up either an unsecured set of Jonline's HTTP endpoints, or a redirect to the HTTPS/443 server if that one launched successfully.
//      * Port 8000 *always* serves up an unsecured Jonline UI, in case something goes horribly wrong with 80 and 443. It can probably not be exposed in your load balancer/to the web.
//      * Port 27705 is an unsecured HTTP server meant for communication with other non-web facing services on your computer or in your cluster. It should not be exposed to the web.
//          * Currently this just has an `/email` endpoint. It is designed for [email/SMTP support via an integration with Stalwart](https://github.com/JonLatane/jonline/tree/main/deploys/email).
//
// #### API Design Notes
// ##### Moderation and Visibility
// Jonline APIs are designed to support [`Moderation`](#jonline-Moderation) and [`Visibility`](#jonline-Visibility) controls at the level of individual entities. However, to keep things
// DRY, moderation and visibility controls are only implemented for [`User`](#jonline-User)s, [`Media`](#jonline-Media), [`Group`](#jonline-Group)s, and [`Post`](#jonline-Post)s.
//
// [`Event`](#jonline-Event)s and future [`Post`](#jonline-Post)-like types simply use the same implementation as their contained [`Post`](#jonline-Post)s. The intent here is to maximize
// both shared code and implementation robustness.
//
// ##### Composition Over Inheritance
// Jonline's APIs are designed using composition over inheritance. For instance, an [`Event`](#jonline-Event) contains
// a [`Post`](#jonline-Post) rather than extending it. This pattern fits well all the way from the data model (very boring, safe, and normalized), 
// through Rust code implementing APIs, to both functional React code and more-OOP Flutter code equally well.
//
// ##### Predictable Atomicity
// The use of composition over inheritance also means that Jonline APIs can be *predictably* non-atomic based on their compositional structure.
// For instance, [`UpdatePost`](#grpc-api-UpdatePost) is fully atomic.
//
// [`UpdateEvent`](#grpc-api-UpdateEvent), however, is non-atomic. Given that an [`Event`](#jonline-Event) has a [`Post`](#jonline-Post) and many [`EventInstance`](#jonline-EventInstance)s,
// [`UpdateEvent`](#grpc-api-UpdateEvent) is implemented as a composition of four other RPCs -- each independently callable and individually atomic --
// run in a fixed order: [`UpdateEventDetails`](#grpc-api-UpdateEventDetails) (which itself first updates the [`Event`](#jonline-Event)'s own [`Post`](#jonline-Post)
// atomically, literally calling the [`UpdatePost`](#grpc-api-UpdatePost) RPC), then [`CreateNewEventInstances`](#grpc-api-CreateNewEventInstances),
// [`UpdateEventInstances`](#grpc-api-UpdateEventInstances), and finally [`DeleteRemovedEventInstances`](#grpc-api-DeleteRemovedEventInstances).
// Create must run before Delete so that a request which both drops an old [`EventInstance`](#jonline-EventInstance) and adds a new one never transiently
// leaves the [`Event`](#jonline-Event) with zero instances.
//
// Because moderation/visibility lives at the [`Post`](#jonline-Post) level, and [`UpdateEventDetails`](#grpc-api-UpdateEventDetails) runs first, this means that a developer error in the
// later [`EventInstance`](#jonline-EventInstance)-processing steps cannot prevent visibility and moderation changes from being made in Events, even if there are errors elsewhere.
// This should prove a robust pattern for any future entities intended to be shareable at a Group level with visibility and
// moderation controls (for instance, `Sheet`, `SharedExpenseReport`, `SharedCalendar`, etc.). The entire architecture should promote this
// approach to predictable atomicity.
//
// #### Core Types
// Jonline's data model centers around a handful of top-level types, most of which carry their own
// [`Visibility`](#jonline-Visibility) and [`Moderation`](#jonline-Moderation) state and can be organized into
// [`Group`](#jonline-Group)s.
//
// ##### ServerConfiguration
// Jonline incorporates server configuration, including fairly deep customization of the end-user UI/UX, as perhaps its *most* primitive type.
// [`ServerConfiguration`](#jonline-ServerConfiguration) is unlike most of the highly-normalized, minimalist types in the Jonline protocol,
// and is more like a document than a row in a database. (That said, every [`ServerConfiguration`](#jonline-ServerConfiguration) change *is* a row in a database, meaning
// reverting broken configurations is easy.)
//
// Any client using the Jonline protocol is basically expected to follow a flow of "get service version, then [`ServerConfiguration`](#jonline-ServerConfiguration),
// then worry about auth, then finally about retrieving anything else."
//
// ##### User
// A [`User`](#jonline-User) is a Jonline account: username, real name, bio, avatar, contact methods, and
// [`Permission`](#jonline-Permission)s, plus counts (followers, posts, events, etc.) and federation info (see
// [Federated Profiles](#federated-profiles) above). A lighter-weight [`Author`](#jonline-Author) (just ID, username,
// avatar, real name, permissions) is embedded on [`Post`](#jonline-Post)s, [`Message`](#jonline-Message)s, and similar
// content types instead of a full [`User`](#jonline-User), to keep those payloads small.
//
// - **Follows**: A [`Follow`](#jonline-Follow) is one [`User`](#jonline-User) following another, optionally subject to the target's moderation
// (i.e. approval). Mutual follows make two users "friends." Follows also drive the `FOLLOWING_POSTS`/`FOLLOWING_EVENTS`
// listing types and `LIMITED`-visibility content.
//
// - **Memberships**: A [`Membership`](#jonline-Membership) is a [`User`](#jonline-User)'s membership (or pending join request/invitation)
// in a [`Group`](#jonline-Group), tracking the user's [`Permission`](#jonline-Permission)s within the group plus separate group-side and user-side [`Moderation`](#jonline-Moderation)
// (for join-approval flows). Returned as part of [`User`](#jonline-User)/[`Group`](#jonline-Group) payloads, and via [`Member`](#jonline-Member) when listing a Group's members.
//
//
// - **EventSyncSources**: A [`User`](#jonline-User) can own many [`EventSyncSource`](#jonline-EventSyncSource)s - external calendars to
// pull [`Event`](#jonline-Event)s in from, e.g. an iCal subscription. See the Event section below for how these attach to [`Event`](#jonline-Event)s.
//
// - **SyncDestinations**: A [`User`](#jonline-User) can also own many [`SyncDestination`](#jonline-SyncDestination)s -
// external targets to push [`EventInstance`](#jonline-EventInstance)s and [`Post`](#jonline-Post)s out to, e.g. a connected Facebook Page (configured via
// [`FacebookPage`](#jonline-FacebookPage)). See the Event and Post sections below for how these attach.
//
// ##### Media
// [`Media`](#jonline-Media) represents an uploaded (or server-generated) photo or video. Unlike other types, Media
// content itself is *not* served over gRPC - it's uploaded/downloaded via plain HTTP (`POST`/`GET /media`) - while
// its metadata (content type, name, visibility, moderation) is managed like any other Jonline type. Other messages
// (like `User.avatar`, `Group.avatar`, and `Post.media`) reference Media via the lightweight [`MediaReference`](#jonline-MediaReference) type.
//
// ##### Post
// [`Post`](#jonline-Post) is Jonline's fundamental content/building-block type: it's what actually carries a
// title/link/content body, visibility, and moderation, and is reused (via [`PostContext`](#jonline-PostContext)) as the backing data for
// replies, [`Event`](#jonline-Event)s, and [`EventInstance`](#jonline-EventInstance)s alike. Posts can be replied to (threaded via
// `reply_to_post_id`), cross-posted to [`Group`](#jonline-Group)s ([`GroupPost`](#jonline-GroupPost)), and shared directly with users ([`UserPost`](#jonline-UserPost)).
//
// - **GroupPosts**: A [`GroupPost`](#jonline-GroupPost) is the cross-posting of a [`Post`](#jonline-Post) into a [`Group`](#jonline-Group), carrying the group-specific
// moderation status and who shared it, separately from the Post's own (author-set) visibility/moderation.
//
// - **UserPosts**: A [`UserPost`](#jonline-UserPost) is a "direct share" of a [`Post`](#jonline-Post) to a [`User`](#jonline-User) (see also `DIRECT`
// [`Visibility`](#jonline-Visibility)). Currently unused/unimplemented.
//
// - **SyncDestinations**: A [`Post`](#jonline-Post) may also be synced (cross-posted) out to a user-owned
// [`SyncDestination`](#jonline-SyncDestination) (e.g. a connected Facebook Page), the same mechanism
// [`EventInstance`](#jonline-EventInstance)s use (see below) - each Post may push to several destinations at once, tracked via the
// repeated `Post.sync_destinations` (each a [`SyncDestinationStatus`](#jonline-SyncDestinationStatus)).
//
// ##### Event
// An [`Event`](#jonline-Event) is a wrapper for *at least two* [`Post`](#jonline-Post)s. It always has its own top-level [`Post`](#jonline-Post)
// (`PostContext.EVENT`, holding the event's overall title/description) *and* it must have at least one
// [`EventInstance`](#jonline-EventInstance) (see below), each of which in turn must have its own [`Post`](#jonline-Post)
// (`PostContext.EVENT_INSTANCE`, carrying that instance's start/end time, [`Location`](#jonline-Location), and optional per-instance
// title/link/content override). So the smallest possible Event already backs 2 Posts, and events with recurring/multiple
// instances back one Post per instance beyond that.
//
// - **EventInstances**: An [`EventInstance`](#jonline-EventInstance) is the actual time-boxed occurrence of an [`Event`](#jonline-Event) -
// it carries the `starts_at`/`ends_at` timestamps and optional [`Location`](#jonline-Location) that the parent [`Event`](#jonline-Event) itself does not have.
// An [`Event`](#jonline-Event) with zero instances is meaningless (no time or place to attach to), so every [`Event`](#jonline-Event) must have at least one.
//
//     - **EventAttendances**: An [`EventAttendance`](#jonline-EventAttendance) (an "RSVP") tracks one attendee's status
//     (`INTERESTED`, `REQUESTED`, `GOING`, `NOT_GOING`) for a specific [`EventInstance`](#jonline-EventInstance). Attendees may be logged-in [`User`](#jonline-User)s
//     or anonymous (tracked via [`AnonymousAttendee`](#jonline-AnonymousAttendee) plus an `auth_token`), and are subject to their own [`Moderation`](#jonline-Moderation),
//     independent of the Event's/Instance's own Post moderation.
//
//     - **EventSyncSource**: It's actually the parent [`Event`](#jonline-Event) (not the [`EventInstance`](#jonline-EventInstance)) that can be synced *in* from a
//     user-owned [`EventSyncSource`](#jonline-EventSyncSource) (e.g. an iCal subscription). The relationship is
//     1:(0 or 1): a single source can back many synced [`Event`](#jonline-Event)s, but each [`Event`](#jonline-Event) has *at most one* source it came from
//     (`Event.event_sync_source` is a single optional field, not repeated).
//
//     - **SyncDestinations**: Conversely, it's each [`EventInstance`](#jonline-EventInstance) (not the parent [`Event`](#jonline-Event)) that syncs *out* to
//     [`SyncDestination`](#jonline-SyncDestination)s (e.g. connected Facebook Pages) - the same mechanism [`Post`](#jonline-Post)s use
//     (see above). Unlike [`EventSyncSource`](#jonline-EventSyncSource), this is the outlier's counterpart - a many-to-many relationship: each
//     instance may push to several destinations at once, tracked per-destination via the repeated
//     `EventInstance.sync_destinations` (each a [`SyncDestinationStatus`](#jonline-SyncDestinationStatus)), carrying
//     the destination's resulting post ID/URL and last-synced time.
//
// ##### Group
// A [`Group`](#jonline-Group) organizes [`User`](#jonline-User)s, [`Post`](#jonline-Post)s, and [`Event`](#jonline-Event)s together under shared visibility, moderation,
// and permission defaults.
//
// - **Memberships**: A [`Membership`](#jonline-Membership) is a [`User`](#jonline-User)'s membership (or pending join request/invitation)
// in a [`Group`](#jonline-Group), tracking the user's [`Permission`](#jonline-Permission)s within the group plus separate group-side and user-side [`Moderation`](#jonline-Moderation)
// (for join-approval flows). Returned as part of [`User`](#jonline-User)/[`Group`](#jonline-Group) payloads, and via [`Member`](#jonline-Member) when listing a Group's members.
//
// - **GroupPosts**: A [`GroupPost`](#jonline-GroupPost) is the cross-posting of a [`Post`](#jonline-Post) into a [`Group`](#jonline-Group), carrying the group-specific
// moderation status and who shared it, separately from the Post's own (author-set) visibility/moderation.
//
// ##### Message
// [`Message`](#jonline-Message) is Jonline's "low trust" messaging/email system, meant to let strangers on a server
// make first contact (e.g. via email, with no account required) before moving to a more trusted channel. Admins have
// open access to all Messages on a server.
//
// - **MessagingGroup**: A [`MessagingGroup`](#jonline-MessagingGroup) is the set of participants in a Message conversation. Every [`Message`](#jonline-Message)
// belongs to one; if a client wasn't a visible recipient (e.g. they were BCC'ed), the [`Message`](#jonline-Message) they receive omits it.
//
// #### Authentication
// Jonline uses a standard OAuth2 flow (over gRPC) for authentication, with rotating `access_token`s and `refresh_token`s.
// Authenticated calls require an `access_token` in request metadata to be included / directly as the value of the
// `authorization` header (no `Bearer ` prefix).
//
// First, before any authentication is done, you should [resolve your backend host](#http-based-client-host-negotiation-for-external-cdns-get-backend_host),
// and check its [`GetServiceVersion`](#grpc-api-GetServiceVersion) and [`GetServerConfiguration`](#grpc-api-GetServerConfiguration) RPCs.
// Check whether you have the `CREATE_ACCOUNT` and/or `LOGIN` [`AuthenticationFeature`](#jonline-AuthenticationFeature)s in your [`ServerConfiguration`](#jonline-ServerConfiguration).
//
// Next, use the [`CreateAccount`](#grpc-api-CreateAccount) or [`Login`](#grpc-api-Login) RPCs to fetch (and store) an initial
// `refresh_token` and `access_token`. Clients should use the `access_token` until it expires,
// then use the `refresh_token` to call the [`AccessToken`](#grpc-api-AccessToken) RPC for a new one. (The [`AccessToken`](#grpc-api-AccessToken) RPC
// may, at random, also return a new `refresh_token`. If so, it should immediately replace the old
// one in client storage.)
//
// ##### Federated Authentication
// tl;dr: Lets you sign in to the `jon@bullcity.social` user on `jonline.io`, without ever entering your `bullcity.social`
// credentials on `jonline.io`.
//
// Elm-only feature (`frontends/elm-spa`) letting a user sign in to one Jonline server using an account they already
// have (or are willing to create) on a *different* Jonline server, without either backend ever seeing a plaintext
// token that isn't its own. It's pure browser-to-browser: two Elm SPA page routes
// ([`/auth/to/...`](#get-authtopublic_keyrequesting_host-federated-sign-in-sending-side) and
// [`/auth/from/...`](#get-authfromencrypted_account-federated-sign-in-receiving-side)) exchange
// an encrypted account payload via a full-page redirect; no gRPC/HTTP endpoint on either backend is involved beyond
// the [`Login`](#grpc-api-Login) RPC itself.
//
// 1. Say a user is on `jonline.io`, adding a new account, and enters `bullcity.social` as the server. Since that
// isn't the current host, the Accounts panel offers a "Sign in via bullcity.social" button instead of (or alongside)
// a normal username/password form.
// 2. Clicking it does a full-page navigation to `bullcity.social`, carrying `jonline.io`'s ECDH public key (freshly
// generated in-browser and persisted for this purpose) and its own hostname in the URL: `/auth/to/{public_key}@jonline.io`.
// 3. `bullcity.social` shows its own sign-in form (or, if already signed in there, a badge to reuse that session),
// plus a "Sign back in here" checkbox, checked by default.
// 4. The user authenticates via the [`Login`](#grpc-api-Login) RPC. This always issues a *fresh* `refresh_token`/
// `access_token` pair, reserved purely for transfer back to `jonline.io` -- it's never used to sign the browser into
// `bullcity.social` itself. If "Sign back in here" is checked, a **second**, independent [`Login`](#grpc-api-Login)
// call also runs, so `bullcity.social` gets its own local session too, and the two servers never end up sharing a
// token pair. (Hence "1-2 refresh tokens.")
// 5. The transfer account (server, user ID, username, both tokens, avatar, permissions, etc.) is JSON-encoded and
// encrypted to `jonline.io`'s public key from step 2 (ephemeral ECDH + HKDF + AES-GCM -- see below), then the
// browser is redirected back to `jonline.io` at `/auth/from/{ciphertext}`.
// 6. `jonline.io` decrypts the payload with the private key it generated in step 2, then either silently accepts it
// (if it knows where to send the user back to) or shows a confirmation screen (avatar/name/server, Confirm/Cancel)
// before adding the account to its Accounts panel. Either way, the one-time keypair generated in step 2 is discarded
// and a fresh one generated in its place, so it can't be reused for a second transfer.
//
// See the two HTTP-level routes below for the exact URL/crypto shape.
//
// #### Federation
// Whereas other federated social networks (e.g. ActivityPub) have both client-server and server-server APIs,
// Jonline only has client-server APIs. While server-to-server communication is possible, nothing but some
// "nice to have" features require it, so it is not used.
//
// ##### Federated Servers
// Jonline servers can recommend other servers to clients with the `federation_info` field (a [`FederationInfo` message](#jonline-FederationInfo)) in [`ServerConfiguration`](#jonline-ServerConfiguration).
// Clients can use this information to discover other servers, or users can add new servers manually.
// Note that, at least for web clients, this means everything is subject to CORS. In the future, Jonline will
// allow CORS to be configured in a "strict" mode, so someone else's Jonline server cannot be used to access your server's data
// unless you explicitly allow it.
//
// ##### Federated Profiles
// Jonline users can federate with users on any other Jonline server. This works by two-way verification:
// For example, Jon has the user [`jonline.io/jon`](https://jonline.io/jon), [`oakcity.social/jon`](https://oakcity.social/jon),
// and [`bullcity.social/jon`](https://bullcity.social/jon) associated with one another. 
// The UI will only show federated profiles if *both use profiles* have federated with one another.
//
// This mechanism also allows users to link multiple profiles on the same server together. For instance, [`bullcity.social/jon`](https://bullcity.social/jon)
// and [`bullcity.social/openmic`](https://bullcity.social/openmic) are linked together, but [`bullcity.social/openmic`](https://bullcity.social/openmic)
// isn't linked to [`jonline.io/jon`](https://jonline.io/jon) or [`oakcity.social/jon`](https://oakcity.social/jon).
//
// Federated profiles are managed via the `federated_profiles` field (a `repeated` [`FederatedAccount`](#jonline-FederatedAccount)) in the [`User`](#jonline-User) message.
// 
// ##### Federated Browsing
// Jonline's protocols and UI are designed to work together to present a seamless UX for content from many types of communities. Users can add/remove servers
// in a way that gives them control, transparency and trust. Meanwhile, server owners get extreme customization and useful integrations with social media
// platforms.
//
// ##### Federated Messaging
// Jonline's Elm Messaging UI is generally a multi-server federated messenger. The main limitation is that it can only receive push notifications
// from one server. (This could be changed with VAPID key sharing, but is part of the VAPID protocol.)
//
// #### Synchronization
// While Federation is a first-class feature of Jonline, it also supports synchronization with other
// fediverse platforms as well as other less-open platforms. All API keys for external services are stored
// in [`ServerConfiguration`](#jonline-ServerConfiguration)'s `federation_info`.
//
// ##### SyncDestination
// A [`SyncDestination`](#jonline-SyncDestination) is a user-owned external target to push [`EventInstance`](#jonline-EventInstance)s and
// [`Post`](#jonline-Post)s out to, via a `oneof configuration` naming which platform it is. This is a many-to-many relationship: it's
// each [`EventInstance`](#jonline-EventInstance) or [`Post`](#jonline-Post) (not, say, the parent [`Event`](#jonline-Event)) that syncs out, and each may push to several
// destinations at once, tracked per-destination via the repeated `EventInstance.sync_destinations`/
// `Post.sync_destinations` (each a [`SyncDestinationStatus`](#jonline-SyncDestinationStatus), carrying the
// destination's resulting post ID/URL and last-synced time). Destinations are pushed to on demand rather than synced
// in bulk on an interval, so `synced_event_instance_count`/`synced_post_count` are computed with a `COUNT` at request
// time instead of being recomputed-and-stored.
//
// Destinations are managed via [`GetSyncDestinations`](#grpc-api-GetSyncDestinations),
// [`CreateSyncDestination`](#grpc-api-CreateSyncDestination), [`UpdateSyncDestination`](#grpc-api-UpdateSyncDestination),
// and [`DeleteSyncDestination`](#grpc-api-DeleteSyncDestination) -- each gated on the `SYNC_EVENTS_TO_*`/
// `SYNC_POSTS_TO_*` permission pair matching the destination's own platform (or Admin; see each platform's own
// section below). Actually syncing (or un-syncing) a given [`EventInstance`](#jonline-EventInstance) or [`Post`](#jonline-Post) to a destination is a separate
// step, via [`SyncEventInstance`](#grpc-api-SyncEventInstance)/
// [`DeleteEventInstanceSyncDestination`](#grpc-api-DeleteEventInstanceSyncDestination) and
// [`SyncPost`](#grpc-api-SyncPost)/[`DeletePostSyncDestination`](#grpc-api-DeletePostSyncDestination), gated the same
// way (the `_EVENTS_`/`_POSTS_` half matching which RPC).
//
// ###### Facebook
// `configuration.facebook_page` (a [`FacebookPage`](#jonline-FacebookPage)) is a connected Facebook Page.
// Connecting one requires a short-lived user access token from client-side Facebook Login
// (`FacebookPage.short_lived_user_access_token`), which the server exchanges for a long-lived Page access token; the
// short-lived token is write-only and never populated back in responses. Gated on `SYNC_EVENTS_TO_FACEBOOK`/
// `SYNC_POSTS_TO_FACEBOOK`.
//
// ###### Instagram
// `configuration.instagram_account` (an [`InstagramAccount`](#jonline-InstagramAccount)) is a connected Instagram
// Business/Creator account. Instagram posting is only possible for an account linked to a Facebook Page, so
// connecting one reuses the exact same Facebook Login flow/app credentials as Facebook above -- the server exchanges
// the token for the chosen Page's access token, then looks up that Page's linked Instagram Business account
// (`instagram_business_account_id`). Unlike Facebook, Instagram's Graph API has no text-only post type; syncing a
// [`Post`](#jonline-Post)/[`EventInstance`](#jonline-EventInstance) with no attached media fails with `instagram_requires_media`. Gated on
// `SYNC_EVENTS_TO_INSTAGRAM`/`SYNC_POSTS_TO_INSTAGRAM`.
//
// ###### Mastodon
// `configuration.mastodon_account` (a [`MastodonAccount`](#jonline-MastodonAccount)) is a connected Mastodon
// account, on any instance the user names (`instance_host`) -- there's no single app to register the way
// Facebook/Instagram have one, so connecting one is a user-pasted Personal Access Token
// (`MastodonAccount.access_token`, generated on the user's own instance under Preferences > Development) rather than
// an OAuth popup. Gated on `SYNC_EVENTS_TO_MASTODON`/`SYNC_POSTS_TO_MASTODON`.
//
// ###### Bluesky
// `configuration.bluesky_account` (a [`BlueskyAccount`](#jonline-BlueskyAccount)) is a connected Bluesky (AT
// Protocol) account. Connecting one is a user-supplied "App Password" (`BlueskyAccount.app_password`, generated at
// Settings > App Passwords -- not the account's main password) rather than an OAuth popup. Gated on
// `SYNC_EVENTS_TO_BLUESKY`/`SYNC_POSTS_TO_BLUESKY`.
//
// ###### X (Twitter)
// `configuration.x_twitter_account` (an [`XTwitterAccount`](#jonline-XTwitterAccount)) is reserved for a connected X
// account, but **not yet functional** -- this server has no registered X Developer App
// (`FederationInfo.x_twitter_auth_config`), so every RPC touching an [`XTwitterAccount`](#jonline-XTwitterAccount) destination fails with
// `x_twitter_app_not_configured`. Gated on `SYNC_EVENTS_TO_X_TWITTER`/`SYNC_POSTS_TO_X_TWITTER` once functional.
//
// ###### Threads
// `configuration.threads_account` (a [`ThreadsAccount`](#jonline-ThreadsAccount)) is a connected Threads account.
// Threads API is a product added to this server's *existing* Facebook App (see [`FacebookAuthConfig`](#jonline-FacebookAuthConfig)) rather than a
// separately-registered app, but its OAuth flow is otherwise its own: authorization happens at threads.net (not
// facebook.com) using `response_type=code` rather than Facebook's implicit `response_type=token`, with no "choose a
// Page" step -- it directly authorizes the user's own Threads account. The server exchanges the code for a
// short-lived token, then a long-lived one (~60 day expiry, refreshable via `grant_type=th_refresh_token` -- not yet
// implemented, so a connected destination needs reconnecting after ~60 days). Unlike Instagram, Threads supports
// text-only posts. Gated on `SYNC_EVENTS_TO_THREADS`/`SYNC_POSTS_TO_THREADS`.
//
// ##### EventSyncSource
// An [`EventSyncSource`](#jonline-EventSyncSource) mirrors [`SyncDestination`](#jonline-SyncDestination), but for pulling [`Event`](#jonline-Event)s in rather than
// pushing content out -- currently only an iCal subscription URL (`configuration.ics_subscription_url`), though the
// `oneof` leaves room for other source types. Unlike [`SyncDestination`](#jonline-SyncDestination), this is a 1:(0 or 1) relationship: it's the
// parent [`Event`](#jonline-Event) (not the [`EventInstance`](#jonline-EventInstance)) that gets synced in and tagged with its source
// (`Event.event_sync_source`), since a single source can back many synced [`Event`](#jonline-Event)s but each [`Event`](#jonline-Event) has at most one
// source it came from. A background job re-pulls each source on its own `sync_interval_seconds` cadence,
// recomputing `event_count`/`event_instance_count` on every sync.
//
// Sources are managed via [`GetEventSyncSources`](#grpc-api-GetEventSyncSources), [`CreateEventSyncSource`](#grpc-api-CreateEventSyncSource)
// (requires `SYNCHRONIZE_EVENTS`, or Admin), [`UpdateEventSyncSource`](#grpc-api-UpdateEventSyncSource), and
// [`DeleteEventSyncSource`](#grpc-api-DeleteEventSyncSource).
//
// #### HTTP Endpoints
// ##### Internal HTTP server (27705)
// ###### `POST /email`: Stalwart Email Integration
// Delivery endpoint called by the [Stalwart](https://stalw.art) mail server (see
// [`deploys/email`](https://github.com/JonLatane/jonline/tree/main/deploys/email)'s
// [README](https://github.com/JonLatane/jonline/blob/main/deploys/email/README.md) for setup/architecture) once it
// accepts an inbound message addressed to one of this Jonline instance's onboarded domains, turning it into a
// [`Message`](#jonline-Message). It is **internal-only**: mounted solely on the unsecured 27705 server (never on
// 80/8000/443), has no authentication of its own, and trusts its caller completely -- that trust boundary is
// expected to be enforced at the network layer (e.g. a `NetworkPolicy` restricting port 27705 to Stalwart's pod).
//
// * **Request**: the body is Stalwart's `data`-stage [MTA Hook](https://stalw.art/docs/mta/filter/mtahooks/) JSON
// payload (up to 50 MiB), not a raw MIME stream -- only the fields below are read, the rest of Stalwart's payload
// (`context`, `envelope.from`, `message.serverHeaders`, `message.size`, ...) is ignored:
// ```json
// {
//   "envelope": { "to": [{ "address": "someone@yourdomain.com" }] },
//   "message": {
//     "headers": [["Subject", "Hello"], ["From", "sender@example.com"], ["To", "someone@yourdomain.com"]],
//     "contents": "Hello, World!\r\n"
//   }
// }
// ```
// Recipients come from `envelope.to[].address` -- deliberately the SMTP envelope, not the message's `To`/`Cc`
// headers, since that's the only place Bcc'd recipients show up at all. The message itself is reconstructed by
// concatenating `message.headers` (each an unfolded `[name, value]` pair) with `message.contents` across a blank
// line, which `mail_parser` then parses as the RFC822 message -- Stalwart only splits at the top-level header/body
// boundary, so this still captures multipart bodies and attachments intact within `contents`. A body that isn't
// valid JSON in this shape, or that doesn't reconstruct into a parseable MIME message, returns `400 Bad Request`;
// an oversized body returns `413 Payload Too Large`.
// * **Recipient resolution**: each envelope address's local part (before the `@`) is looked up as a username on this
// server; addresses that don't match any user are silently skipped, since Stalwart is expected to have already
// confirmed deliverability before calling this endpoint. If none match, the whole message is dropped and the
// endpoint returns `404 Not Found`.
// * **Storage**: matched recipients become a [`Message`](#jonline-Message) addressed to a
// [`MessagingGroup`](#jonline-MessagingGroup) keyed on the `To`/`Cc` recipients only -- Bcc'd recipients are excluded
// from the group (so they stay invisible to everyone else on the thread) and instead recorded individually as `Bcc`
// rows on the [`Message`](#jonline-Message). The [`Message`](#jonline-Message) has no `from_user_id`, since inbound email never has a local sender; its
// parsed `from`/`to`/`cc` headers are stored alongside it, and the raw `.eml` is uploaded to the same MinIO store
// used for [`Media`](#jonline-Media). Duplicate deliveries of the same `Message-ID` (Stalwart retries on transient failure) reuse the
// existing [`Message`](#jonline-Message) row rather than storing/uploading a duplicate.
// * **Response**: `200 OK` with a body of `{"action": "accept"}` on success -- Stalwart's MTA Hook protocol parses
// the response *body*, not just the status code, so this has to be the exact shape it expects
// (see <https://stalw.art/docs/mta/filter/mtahooks/>) or Stalwart treats the call as a hook failure regardless of
// status; combined with the `MtaHook`'s `tempFailOnError: true`, that surfaces to the sending client as a
// `451` temp-fail rather than anything indicating the real cause.
//
// ##### External HTTP servers (80, 8000, 443)
// Note that, if the TLS server on port 443 starts up successfully, the server on port 80
// will simply redirect to HTTPS.
//
// The server on port 8000 will always serve up unsecured HTTP. It is up to server admins to block this
// port if they find that necessary.
//
// ###### `GET /backend_host`: HTTP-based client host negotiation (for external CDNs)
// When first negotiating the gRPC connection to a host, say, `jonline.io`, before attempting
// to connect to `jonline.io` via gRPC on 27707/443, the client
// is expected to first attempt to `GET jonline.io/backend_host` over HTTP (port 80) or HTTPS (port 443)
// (depending upon whether the gRPC server is expected to have TLS). If the `backend_host` string resource
// is a valid domain, say, `jonline.io.itsj.online`, the client is expected to connect
// to `jonline.io.itsj.online` on port 27707/443 instead. To users, the server should still *generally* appear to 
// be `jonline.io`. The client can trust `jonline.io/backend_host` to always point to the correct backend host for
// `jonline.io`.
//
// ###### `GET /auth/to/{public_key}@{requesting_host}`: Federated Sign-In (sending side)
// Half [web UI path](#authtopublic_keyrequesting_host-and-authfromencrypted_account-federated-sign-in), half
// endpoint: it's an Elm SPA page (`Pages.Auth.To.Key_`, served like any other SPA route -- under the `/elm` base
// path when the Elm frontend isn't the one mounted at `/`) rather than a backend/gRPC handler, but it consumes
// structured input straight from the URL and "responds" with a redirect carrying an encrypted payload, so it's
// documented here as an endpoint too. Handled entirely in-browser; reached only via the cross-origin redirect from
// step 2 above (built by the *requesting* origin's Accounts panel), never linked to directly.
// * **Path params**: `{public_key}` is the requesting origin's ECDH (P-256) public key, raw-exported and
// base64url-encoded; `{requesting_host}` is that origin's own hostname. The two are joined with a literal `@`
// (chosen because `@` never appears in the base64url/dot-joined ciphertext the
// [`/auth/from`](#get-authfromencrypted_account-federated-sign-in-receiving-side) route below expects, so the
// split is unambiguous).
// * **Query params**: `start_path` -- the app-relative path the user was on when they clicked "Sign in via ...", so
// they can be dropped back there after the round trip. Percent-encoded; passed through unchanged to the eventual
// [`/auth/from`](#get-authfromencrypted_account-federated-sign-in-receiving-side) redirect.
// * **Behavior**: shows a sign-in form for *this* server (or a "currently signed in as ..." badge, if already
// authenticated here), plus a "Sign back in here"/"Also sign in here" checkbox (checked by default). Submitting
// calls the [`Login`](#grpc-api-Login) RPC (always a fresh login, never reusing stored tokens) to mint a transfer
// account; if the checkbox is checked, a second independent [`Login`](#grpc-api-Login) call also signs the browser
// into this server locally. The transfer account is then AES-GCM-encrypted to `{public_key}` (fresh ephemeral ECDH
// keypair per encryption, shared secret via ECDH + HKDF-SHA256, output `ephemeral_public_key.iv.ciphertext`, each
// part base64url) and the browser is redirected to
// `https://{requesting_host}/auth/from/{ciphertext}?start_path={start_path}`.
//
// ###### `GET /auth/from/{encrypted_account}`: Federated Sign-In (receiving side)
// Likewise a [web
// UI](#authtopublic_keyrequesting_host-and-authfromencrypted_account-federated-sign-in)/endpoint hybrid: the Elm
// SPA page (`Pages.Auth.From.EncodedAccount_`) that closes the loop from
// [`/auth/to`](#get-authtopublic_keyrequesting_host-federated-sign-in-sending-side) above, taking its ciphertext
// as input and "responding" by adding the decrypted account. Reached only via that redirect.
// * **Path params**: `{encrypted_account}` is the `ephemeral_public_key.iv.ciphertext` blob produced by
// [`/auth/to`](#get-authtopublic_keyrequesting_host-federated-sign-in-sending-side).
// * **Query params**: `start_path`, passed through unchanged from
// [`/auth/to`](#get-authtopublic_keyrequesting_host-federated-sign-in-sending-side).
// * **Behavior**: decrypts `{encrypted_account}` using the private key this origin generated when it built the
// [`/auth/to`](#get-authtopublic_keyrequesting_host-federated-sign-in-sending-side) link (same ECDH +
// HKDF-SHA256 + AES-GCM derivation, in reverse), yielding the transfer account (including its
// `refresh_token`/`access_token`). If `start_path` is present, the account is added straight to the local Accounts
// panel and the browser navigates to it; otherwise a confirmation screen (avatar, name, server, Confirm/Cancel) is
// shown first. Either way, once the flow completes (confirmed or cancelled), the one-time private key is discarded
// and a fresh keypair generated, so it's single-use per completed/cancelled transfer.
//
// This negotiation enables support for external CDNs as frontends. See https://jonline.io/about?section=cdn for
// more information about external CDN setup. Developers may wish to review the [React/Tamagui](https://github.com/JonLatane/jonline/blob/main/frontends/tamagui/packages/app/store/clients.ts#L116) 
// and [Flutter](https://github.com/JonLatane/jonline/blob/main/frontends/flutter/lib/models/jonline_clients.dart#L26) 
// client implementations of this negotiation.
//
// ###### `GET /robots.txt`: Robots
// Generated on the fly (not a static file) from the request's `Host` header, publicly cacheable for 1 hour. Always
// allows all crawling (`User-agent: * / Allow: /`) and points crawlers at `https://{host}/sitemap.xml`.
//
// ###### `GET /sitemap.xml`: Sitemap
// Generated on the fly (not a static file) from the request's `Host` header, publicly cacheable for 1 hour. Lists a
// fixed set of top-level, server-wide pages -- `/`, `/posts`, `/events`, `/people`, `/about`, `/about_jonline`,
// `/flutter`, `/tamagui`, `/elm` -- plus any `CustomNavigationTabSet.tabs` paths configured on the server (excluding
// the reserved `posts`/`events`/`people`/`about` paths, which are always included above), each qualified with the
// request's `Host`. It also enumerates individual pages: every [`Post`](#jonline-Post) from an unauthenticated [`GetPosts`](#grpc-api-GetPosts) (the same
// "first page" an anonymous visitor sees) as `/post/{id}`, and every [`Event`](#jonline-Event) instance from an unauthenticated
// [`GetEvents`](#grpc-api-GetEvents) starting `EventSettings.calendar_lookback_days` (or 14, if unset) ago as `/event/{instance_id}`.
// It does not (yet) enumerate individual [`User`](#jonline-User) pages.
//
// ###### `GET /favicon.ico`: ICO Favicon
// Serves the server's configured logo (`ServerConfiguration.server_info.logo.square_media_id`, a [`Media`](#jonline-Media)
// reference) as an `.ico`, publicly cacheable for 12 hours (`must-revalidate`), converting on the fly if the
// stored rendition is a `.png`. If no logo is configured, falls back to the bundled Tamagui frontend's default
// favicon instead. Whichever converted rendition of the logo is served, it's picked in size preference order
// Medium, then Small, then Large, then the original upload if none of those conversions exist (favicons are small,
// so there's no reason to prefer a bigger one).
//
// ###### `GET /favicon.png`: PNG Favicon
// As `GET /favicon.ico` above, but serves (and if necessary converts to) `.png` instead.
//
// ###### `POST /media`: Upload Media
// See the [Media](#jonline-Media) section for the [`Media`](#jonline-Media) type itself; this is how its bytes actually get in
// (an `OPTIONS /media` variant also exists, solely to satisfy CORS preflight requests). *Authenticated* (via
// `Authorization` header or a `jonline_access_token` cookie). Requires `Content-Type` and `Filename` headers; the
// body is streamed directly to the object store, capped at 250 MiB -- note that a larger upload is silently
// truncated to that cap rather than rejected, since nothing checks for completeness the way `POST /email` does --
// at a path namespaced by uploader and request host (`user/{user_id}@{host}-{username}/{uuid}-{filename}`). A
// [`Media`](#jonline-Media) row is created immediately at `GLOBAL_PUBLIC` visibility (video content types also get
// a default `video_preview_time_ms`) and its ID returned as plain text -- there's no separate "confirm" step, and
// no image/video conversion happens synchronously on this request (see the background media-conversion job).
//
// ###### `GET /media/{id}?size={original|small|medium|large}`: Download Media
// (An `OPTIONS /media/{id}` variant also exists, solely to satisfy CORS preflight requests.) Publicly downloadable
// -- **moderation/visibility/permission checks on read are not yet enforced** (a `TODO` in `media_file`'s
// implementation), so a [`Media`](#jonline-Media) ID is currently a bearer capability. `size` (default `medium`) selects a converted
// rendition, falling back to the original upload if that conversion doesn't exist. The first request for a given
// rendition lazily downloads it from the object store into a local on-disk cache; subsequent requests are served
// from that cache. Cacheable for 12 hours (`must-revalidate`).
//
// ###### `GET /calendar.ics`: Server Calendar
// Jonline events support iCalendar/RFC5545; only public events are included. "Subscribe" to a Jonline server at,
// for instance, `https://jonline.io/calendar.ics` to get a calendar of all public events on the server. In the
// Tamagui/React frontend, links to these endpoints are provided in the Upcoming Events section of the home page,
// the Events page, and the user profile pages for all users with events in the last 3 months (or in the future).
//
// ###### `GET /calendar.ics?user_id={id}`: User Calendar
// "Subscribe" to a user's calendar at, for instance, `https://jonline.io/calendar.ics?user_id=CruFm` to get a
// calendar of all public events for that user.
//
// #### Web UI paths
// Jonline serves three web frontends from the same backend: Tamagui (React/Next.js), Elm, and Flutter.
//
// Tamagui and Elm share one page structure (below) and are always *both* reachable, explicitly, at `/tamagui/*`
// and `/elm/*` respectively; unprefixed requests (`/`, `/posts`, `/post/{postId}`, etc.) render whichever of the
// two the server's `ServerConfiguration.server_info.web_user_interface` selects (`ELM_SPA` picks Elm; every other
// setting, including no preference at all, picks Tamagui). Elm is a genuine single-page app -- every Elm-served
// path, prefixed or not, resolves to the same `index.html`, with in-app (client-side) routing taking over from
// there -- whereas Tamagui's Next.js build is statically exported one HTML file per route, so the server picks
// between actual distinct files below, each enriched with server-rendered, per-route social-preview
// (`<title>`/`og:*`) tags before being served.
//
// **Flutter does not participate in any of this.** It has no page structure of its own to speak of: no per-route
// pages, no server-rendered social-preview metadata, and no unprefixed presence at all -- a server configured to
// prefer it doesn't route "/" through the Tamagui/Elm machinery below and then render Flutter, it instead serves
// Flutter's own `index.html` directly, bypassing that machinery entirely. Flutter is otherwise reached only at the
// literal `/flutter` and `/flutter/*` paths, which serve its compiled static assets; from there, all further
// in-app navigation is handled entirely client-side by Flutter's own router and is invisible to the server.
//
// The shared Tamagui/Elm page structure, grouped the way the [Elm app's `Pages`
// directory](https://github.com/JonLatane/jonline/tree/main/frontends/elm-spa/src/Pages) is (`{name}` denotes a
// dynamic path segment; `[@{host}]` marks where a [federated](#federated-profiles) `{username}@{host}`-style
// suffix is accepted for that segment):
//
// ##### `/`: Home
// The community's latest activity.
//
// ##### `/posts`: Posts
// The Posts listing.
//
// ###### `/post/{postId}[@{host}]`: Post
// An individual [`Post`](#jonline-Post) -- including [`Event`](#jonline-Event)/[`EventInstance`](#jonline-EventInstance) posts and replies, which are [`Post`](#jonline-Post)s
// themselves (see [Post](#post) above).
//
// ##### `/events`: Events
// The Events listing.
//
// ###### `/event/{eventInstanceId}[@{host}]`: Event
// An individual [`EventInstance`](#jonline-EventInstance).
//
// ###### `/event_ai`: AI Event Importer
// Tamagui-only, for now -- an AI-assisted bulk [`Event`](#jonline-Event) importer. Elm doesn't have this page yet.
//
// ##### `/people`: People
// The People listing.
//
// ###### `/people/follow_requests`: Follow Requests
// The current user's pending [`Follow`](#jonline-Follow) requests.
//
// ###### `/user/{userId}`: Profile
// A [`User`](#jonline-User) profile looked up by (stable) user ID.
//
// ##### `/{custom_tab_or_username}`: User pages by username, or a custom tab
// The same [`User`](#jonline-User) profile (and its Posts/Friends/Followers/Following sub-pages) as `/user/{userId}` above, but
// looked up by the current `username` instead -- lighter-weight to link to, but less stable than `/user/{userId}`
// since a username can change. This single path segment is also the server's last-resort catch-all, resolved in
// order: first any actual matching build asset or other explicit route above (e.g. `/posts`, `/user/{userId}`)
// wins outright; then, if none matched, an admin-configured custom tab path (see
// [`CustomNavigationTabWithPath`](#jonline-CustomNavigationTabWithPath)) -- e.g. a band mounting their Events
// listing at `/gigs` -- wins over a same-named user; only then, last, is it looked up as a plain username. A small
// set of reserved names can never be reached this way, only via `/user/{userId}`.
//
// ###### `/{username}/posts`: Posts
// ###### `/{username}/friends`: Friends
// ###### `/{username}/followers`: Followers
// ###### `/{username}/following`: Following
//
// ##### `/g/{shortname}`: Groups
// A [`Group`](#jonline-Group)'s pages. Tamagui-only for now -- the Elm frontend doesn't have Group pages yet.
//
// ###### `/g/{shortname}`: Home
// ###### `/g/{shortname}/posts`: Posts
// ###### `/g/{shortname}/p/{postId}[@{host}]`: Post
// An individual [`Post`](#jonline-Post) cross-posted into the group.
//
// ###### `/g/{shortname}/events`: Events
// ###### `/g/{shortname}/e/{eventInstanceId}[@{host}]`: Event
// ###### `/g/{shortname}/members`: Members
// ###### `/g/{shortname}/m/{username}`: Member
// An individual [`Member`](#jonline-Member)'s details.
//
// ##### `/server/{serverIdentifier}`: Server
// Information about a (possibly federated) Jonline server.
//
// ##### `/about`, `/about_jonline`: About
// This server's own About page, and a general "what is Jonline" page.
//
// ##### `/auth/to/{public_key}@{requesting_host}` and `/auth/from/{encrypted_account}`: Federated Sign-In
// **Elm-only** -- unlike everything else in this section, these two paths have no Tamagui equivalent; they exist
// purely to drive the [Federated Authentication](#federated-authentication) flow. Since they're consumed like
// ordinary request/response endpoints rather than browsed pages, their full parameter/crypto details are documented
// alongside the rest of the [HTTP Endpoints](#external-http-servers-80-8000-443) above -- see
// [`GET /auth/to/{public_key}@{requesting_host}`](#get-authtopublic_keyrequesting_host-federated-sign-in-sending-side)
// and [`GET /auth/from/{encrypted_account}`](#get-authfromencrypted_account-federated-sign-in-receiving-side).
//
// ### gRPC API
service Jonline {
  // Get the version (from Cargo) of the Jonline service. *Publicly accessible.*
  rpc GetServiceVersion(google.protobuf.Empty) returns (GetServiceVersionResponse) {}
  // Gets the Jonline server's configuration. *Publicly accessible.*
  rpc GetServerConfiguration(google.protobuf.Empty) returns (ServerConfiguration) {}

  // Creates a user account and provides a `refresh_token` (along with an `access_token`). *Publicly accessible.*
  rpc CreateAccount(CreateAccountRequest) returns (RefreshTokenResponse) {}
  // Logs in a user and provides a `refresh_token` (along with an `access_token`). *Publicly accessible.*
  rpc Login(LoginRequest) returns (RefreshTokenResponse) {}
  // Gets a new `access_token` (and possibly a new `refresh_token`, which should replace the old one in client storage), given a `refresh_token`. *Publicly accessible.*
  rpc AccessToken(AccessTokenRequest) returns (AccessTokenResponse) {}
  // Gets the current user. *Authenticated.*
  rpc GetCurrentUser(google.protobuf.Empty) returns (User) {}
  // Resets the current user's - or, for admins, a given user's - password. *Authenticated.*
  rpc ResetPassword(ResetPasswordRequest) returns (google.protobuf.Empty) {}

  // Gets Media (Images, Videos, etc) uploaded/owned by the current user. *Authenticated.* To upload/download actual Media blob/binary data, use the [HTTP Media APIs](#media).
  rpc GetMedia(GetMediaRequest) returns (GetMediaResponse) {}
  // Deletes a media item by ID. *Authenticated.* Note that media may still be accessible for 12 hours after deletes are requested, as separate jobs clean it up from S3/MinIO.
  // Deleting other users' media requires `ADMIN` permissions.
  rpc DeleteMedia(Media) returns (google.protobuf.Empty) {}

  // Gets Users. *Publicly accessible **or** Authenticated.*
  // Unauthenticated calls only return Users of `GLOBAL_PUBLIC` visibility.
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse) {}
  // Update a user by ID. *Authenticated.*
  // Updating other users requires `ADMIN` permissions.
  rpc UpdateUser(User) returns (User) {}
  // Deletes a user by ID. *Authenticated.*
  // Deleting other users requires `ADMIN` permissions.
  rpc DeleteUser(User) returns (google.protobuf.Empty) {}

  // Sends a Message to one or more recipients (creating/reusing their MessagingGroup). *Publicly
  // accessible **or** Authenticated.* Like [`CreatePost`](#grpc-api-CreatePost)/[`CreateEvent`](#grpc-api-CreateEvent), authentication (if any) is via
  // a standard `access_token`; unauthenticated calls are simply sent with no `sender`.
  rpc SendMessage(SendMessageRequest) returns (Message) {}
  // Gets Messages. *Authenticated.*
  // `PERSONAL_MESSAGES(_TEXT_SEARCH)` (and looking up a single Message/MessagingGroup) requires the
  // `READ_PERSONAL_MESSAGES` permission and only returns Messages the current user sent or received.
  // `ALL_SYSTEM_MESSAGES(_TEXT_SEARCH)` requires the `READ_ALL_SYSTEM_MESSAGES` permission and returns
  // every Message on the server.
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse) {}
  // Marks one or more Messages as read (or unread) by the current user, e.g. every message in a
  // thread once it's been opened. *Authenticated.* Only needs the recipient/sender access
  // [`GetMessages`](#grpc-api-GetMessages) already requires for each Message -- no separate permission. Atomic: if the
  // caller lacks access to *any* of `message_ids`, none of them are marked (matching
  // `MarkMessagesReadRequest.message_ids`' own doc), so a client never has to reconcile a
  // partially-applied batch.
  rpc MarkMessagesRead(MarkMessagesReadRequest) returns (MarkMessagesReadResponse) {}

  // Registers (or re-registers) a browser's Web Push subscription for the current user, so new
  // Messages sent/delivered to them (in-app or via email) push a notification to it even while the
  // browser tab is closed. *Authenticated.* Re-registering an already-registered `endpoint` (e.g.
  // because `PushManager.subscribe()` refreshed its keys) updates it in place rather than erroring.
  // No-ops (server-side; not surfaced as an error to the caller) if the server has no
  // [`WebPushConfig`](#jonline-WebPushConfig) configured -- there's nothing to push notifications *with*.
  rpc RegisterPushSubscription(RegisterPushSubscriptionRequest) returns (PushSubscription) {}
  // Unregisters a browser's Web Push subscription, e.g. on logout or when `PushManager.subscribe()`
  // reports the subscription as no longer valid. *Authenticated.* Not an error if `endpoint` isn't
  // currently registered to the calling user.
  rpc UnregisterPushSubscription(UnregisterPushSubscriptionRequest) returns (google.protobuf.Empty) {}
  // Checks whether the calling user specifically (not just "some account on this browser") has a
  // [`PushSubscription`](#jonline-PushSubscription) registered for `endpoint`. *Authenticated.* Exists because a browser only
  // ever exposes its own subscription's `endpoint`/keys, never *who* on the server side is
  // registered against it -- multiple local accounts on the same server can share one browser
  // subscription (see [`RegisterPushSubscription`](#grpc-api-RegisterPushSubscription)'s own doc comment), so knowing the endpoint alone
  // isn't enough to know which of them are actually notified by it.
  rpc GetPushSubscriptionStatus(GetPushSubscriptionStatusRequest) returns (GetPushSubscriptionStatusResponse) {}

  // Follow (or request to follow) a user. *Authenticated.*
  rpc CreateFollow(Follow) returns (Follow) {}
  // Used to approve follow requests. *Authenticated.*
  rpc UpdateFollow(Follow) returns (Follow) {}
  // Unfollow (or unrequest) a user. *Authenticated.*
  rpc DeleteFollow(Follow) returns (google.protobuf.Empty) {}

  // Gets Groups. *Publicly accessible **or** Authenticated.*
  // Unauthenticated calls only return Groups of `GLOBAL_PUBLIC` visibility.
  rpc GetGroups(GetGroupsRequest) returns (GetGroupsResponse) {}
  // Creates a group with the current user as its admin. *Authenticated.*
  // Requires the `CREATE_GROUPS` permission.
  rpc CreateGroup(Group) returns (Group) {}
  // Update a Groups's information, default membership permissions or moderation. *Authenticated.*
  // Requires `ADMIN` permissions within the group, or `ADMIN` permissions for the user.
  rpc UpdateGroup(Group) returns (Group) {}
  // Delete a Group. *Authenticated.*
  // Requires `ADMIN` permissions within the group, or `ADMIN` permissions for the user.
  rpc DeleteGroup(Group) returns (google.protobuf.Empty) {}

  // Get Members (User+Membership) of a Group. *Publicly accessible **or** Authenticated.*
  rpc GetMembers(GetMembersRequest) returns (GetMembersResponse) {}
  // Requests to join a group (or joins it), or sends an invite to the user. *Authenticated.*
  // Memberships and moderations are set to their defaults.
  rpc CreateMembership(Membership) returns (Membership) {}
  // Update aspects of a user's membership. *Authenticated.*
  // Updating permissions requires `ADMIN` permissions within the group, or `ADMIN` permissions for the user.
  // Updating moderation (approving/denying/banning) requires the same, or `MODERATE_USERS` permissions within the group.
  rpc UpdateMembership(Membership) returns (Membership) {}
  // Leave a group (or cancel membership request). *Authenticated.*
  rpc DeleteMembership(Membership) returns (google.protobuf.Empty) {}

  // Gets Posts. *Publicly accessible **or** Authenticated.*
  // Unauthenticated calls only return Posts of `GLOBAL_PUBLIC` visibility.
  rpc GetPosts(GetPostsRequest) returns (GetPostsResponse) {}
  // Creates a Post. *Authenticated.*
  rpc CreatePost(Post) returns (Post) {}
  // Updates a Post. *Authenticated.*
  rpc UpdatePost(Post) returns (Post) {}
  // (TODO) (Soft) deletes a Post. Returns the deleted version of the Post. *Authenticated.*
  rpc DeletePost(Post) returns (Post) {}

  // Star a Post. *Unauthenticated.*
  rpc StarPost(Post) returns (Post) {}
  // Unstar a Post. *Unauthenticated.*
  rpc UnstarPost(Post) returns (Post) {}

  // Syncs (cross-posts) a Post to a SyncDestination. *Authenticated* (destination owner, or Admin), requires `SYNC_POSTS_TO_FACEBOOK` (or Admin).
  rpc SyncPost(SyncPostRequest) returns (Post) {}
  // Removes a Post's sync (cross-post) to a SyncDestination, the reverse of [`SyncPost`](#grpc-api-SyncPost). *Authenticated* (destination owner, or Admin), requires `SYNC_POSTS_TO_FACEBOOK` (or Admin).
  rpc DeletePostSyncDestination(DeletePostSyncDestinationRequest) returns (google.protobuf.Empty) {}

  // Get GroupPosts for a Post (and optional group). *Publicly accessible **or** Authenticated.*
  rpc GetGroupPosts(GetGroupPostsRequest) returns (GetGroupPostsResponse) {}
  // Cross-post a Post to a Group. *Authenticated.*
  rpc CreateGroupPost(GroupPost) returns (GroupPost) {}
  // Group Moderators: Approve/Reject a GroupPost. *Authenticated.*
  rpc UpdateGroupPost(GroupPost) returns (GroupPost) {}
  // Delete a GroupPost. *Authenticated.*
  rpc DeleteGroupPost(GroupPost) returns (google.protobuf.Empty) {}

  // Gets Events. *Publicly accessible **or** Authenticated.*
  // Unauthenticated calls only return Events of `GLOBAL_PUBLIC` visibility.
  rpc GetEvents(GetEventsRequest) returns (GetEventsResponse) {}
  // Creates an Event. *Authenticated.*
  rpc CreateEvent(Event) returns (Event) {}
  // Updates an Event. Automatically creates/updates/deletes child EventInstances of the Event. *Authenticated.*
  // Since Events are more complex structures, [`UpdateEventDetails`](#grpc-api-UpdateEventDetails), 
  // [`CreateNewEventInstances`](#grpc-api-CreateNewEventInstances), [`UpdateEventInstances`](#grpc-api-UpdateEventInstances), and [`DeleteRemovedEventInstances`](#grpc-api-DeleteRemovedEventInstances)
  // are provided as separate RPCs to break down what happens during this request.
  rpc UpdateEvent(Event) returns (Event) {}
  // (Soft) deletes a Event. Returns the deleted version of the Event. *Authenticated.*
  rpc DeleteEvent(Event) returns (Event) {}

  // Updates only the [`Event`](#jonline-Event)'s top-level details and those of its [`Post`](#jonline-Post) (not any [`EventInstance`](#jonline-EventInstance)s or their [`Post`](#jonline-Post)s). *Authenticated.*
  rpc UpdateEventDetails(Event) returns (Event) {}
  // Creates EventInstances in an existing Event for every EventInstance in the request that isn't already on the event. *Authenticated.*
  // Any other instances in the request are ignored.
  rpc CreateNewEventInstances(Event) returns (Event) {}
  // Updates EventInstances in an existing Event for every EventInstance in the request that's already on the event.
  // Any other instances in the request are ignored. *Authenticated.*
  rpc UpdateEventInstances(Event) returns (Event) {}
  // Deletes EventInstances in an existing Event that aren't present in the input Event. *Authenticated.*
  rpc DeleteRemovedEventInstances(Event) returns (Event) {}

  // Gets a user's EventSyncSources. *Authenticated* (self, or Admin for any user).
  rpc GetEventSyncSources(User) returns (GetEventSyncSourcesResponse) {}
  // Creates an EventSyncSource for the current user. *Authenticated*, requires `SYNCHRONIZE_EVENTS` (or Admin).
  rpc CreateEventSyncSource(EventSyncSource) returns (EventSyncSource) {}
  // Updates an EventSyncSource. *Authenticated* (owner, or Admin for any user's), requires `SYNCHRONIZE_EVENTS` (or Admin).
  rpc UpdateEventSyncSource(EventSyncSource) returns (EventSyncSource) {}
  // Deletes an EventSyncSource. *Authenticated* (owner, or Admin).
  rpc DeleteEventSyncSource(DeleteEventSyncSourceRequest) returns (google.protobuf.Empty) {}

  // Gets a user's SyncDestinations. *Authenticated* (self, or Admin for any user).
  rpc GetSyncDestinations(User) returns (GetSyncDestinationsResponse) {}
  // Creates a SyncDestination for the current user. *Authenticated*, requires `SYNC_EVENTS_TO_FACEBOOK` or `SYNC_POSTS_TO_FACEBOOK` (or Admin).
  rpc CreateSyncDestination(SyncDestination) returns (SyncDestination) {}
  // Updates a SyncDestination. *Authenticated* (owner, or Admin for any user's), requires `SYNC_EVENTS_TO_FACEBOOK` or `SYNC_POSTS_TO_FACEBOOK` (or Admin).
  rpc UpdateSyncDestination(SyncDestination) returns (SyncDestination) {}
  // Deletes a SyncDestination. *Authenticated* (owner, or Admin).
  rpc DeleteSyncDestination(DeleteSyncDestinationRequest) returns (google.protobuf.Empty) {}
  // Syncs (cross-posts) an EventInstance to a SyncDestination. *Authenticated* (destination owner, or Admin), requires `SYNC_EVENTS_TO_FACEBOOK` (or Admin).
  rpc SyncEventInstance(SyncEventInstanceRequest) returns (EventInstance) {}
  // Removes an EventInstance's sync (cross-post) to a SyncDestination, the reverse of [`SyncEventInstance`](#grpc-api-SyncEventInstance). *Authenticated* (destination owner, or Admin), requires `SYNC_EVENTS_TO_FACEBOOK` (or Admin).
  rpc DeleteEventInstanceSyncDestination(DeleteEventInstanceSyncDestinationRequest) returns (google.protobuf.Empty) {}

  // Gets EventAttendances for an EventInstance. *Publicly accessible **or** Authenticated.*
  rpc GetEventAttendances(GetEventAttendancesRequest) returns (EventAttendances) {}
  // Upsert an EventAttendance. *Publicly accessible **or** Authenticated, with anonymous RSVP support.*
  // See [EventAttendance](#jonline-EventAttendance) and [AnonymousAttendee](#jonline-AnonymousAttendee)
  // for details. tl;dr: Anonymous RSVPs may updated/deleted with the `AnonymousAttendee.auth_token`
  // returned by this RPC (the client should save this for the user, and ideally, offer a link
  // with the token).
  rpc UpsertEventAttendance(EventAttendance) returns (EventAttendance) {}
  // Delete an EventAttendance.  *Publicly accessible **or** Authenticated, with anonymous RSVP support.*
  rpc DeleteEventAttendance(EventAttendance) returns (google.protobuf.Empty) {}

  // Federate the current user's profile with another user profile. *Authenticated*.
  rpc FederateProfile(FederatedAccount) returns (FederatedAccount) {}
  // *Authenticated*.
  rpc DefederateProfile(FederatedAccount) returns (google.protobuf.Empty) {}
  

  // Configure the server (i.e. the response to GetServerConfiguration). *Authenticated.*
  // Requires `ADMIN` permissions.
  rpc ConfigureServer(ServerConfiguration) returns (ServerConfiguration) {}

  // Delete ALL Media, Posts, Groups and Users except the user who performed the RPC. *Authenticated.*
  // Requires `ADMIN` permissions.
  // Note: Server Configuration is not deleted.
  rpc ResetData(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // (TODO) Reply streaming interface. Currently just streams fake example data.
  rpc StreamReplies(Post) returns (stream Post);
}
